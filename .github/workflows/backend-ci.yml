name: Backend CI

on:
  push:
    branches: [ main, upgrade ]
  pull_request:
    branches: [ main, upgrade ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B clean verify --file backend/pom.xml
