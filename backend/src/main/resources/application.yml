server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: saas-analytics-dashboard
  datasource:
    url: jdbc:h2:file:./data/saasdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 Hours standard

resend:
  api-key: ${RESEND_API_KEY:re_default_placeholder}
  from-email: ${RESEND_FROM_EMAIL:SaaSOptima <onboarding@resend.dev>}

logging:
  level:
    root: INFO
    com.saas.analytics: DEBUG
